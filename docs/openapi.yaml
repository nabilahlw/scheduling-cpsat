  /api/teachers/availability:
    post:
      summary: Post /Api/Teachers/Availability
      operationId: POST__api_teachers_availability_api_teachers_availability_post
      requestBody:
        content:
          application/json:
            schema:
              items:
                $ref: '#/components/schemas/AvailabilityItem'
              type: array
              title: Items
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
