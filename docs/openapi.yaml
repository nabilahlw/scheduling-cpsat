openapi: 3.1.0
info:
  title: School Scheduling API with CP-SAT
  version: 0.1.0
paths:
  /:
    get:
      summary: Get /
      operationId: GET____get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
  /api/auth/change-password:
    post:
      summary: Post /Api/Auth/Change-Password
      operationId: POST__api_auth_change_password_api_auth_change_password_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordChange'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - HTTPBearer: []
  /api/auth/login:
    post:
      summary: Post /Api/Auth/Login
      operationId: POST__api_auth_login_api_auth_login_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
