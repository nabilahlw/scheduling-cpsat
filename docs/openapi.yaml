    delete:
      summary: Delete /Api/Schools/{School Id}
      operationId: DELETE__api_schools__school_id__api_schools__school_id__delete
      security:
      - HTTPBearer: []
      parameters:
      - name: school_id
        in: path
        required: true
        schema:
          type: integer
          title: School Id
      - name: force
        in: query
        required: false
        schema:
          type: boolean
          default: false
          title: Force
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/sessions/{session_id}:
    get:
      summary: Get /Api/Sessions/{Session Id}
      operationId: GET__api_sessions__session_id__api_sessions__session_id__get
      security:
      - HTTPBearer: []
      parameters:
      - name: session_id
        in: path
        required: true
        schema:
          type: integer
          title: Session Id
      responses:
