  /api/db-test:
    get:
      summary: Get /Api/Db-Test
      operationId: GET__api_db_test_api_db_test_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
      security:
      - HTTPBearer: []
  /api/schedule/generate:
    post:
      summary: Post /Api/Schedule/Generate
      description: 'Generate satu hari. Penugasan yang sudah tersimpan di hari yang
        sama ikut diperhitungkan;

        sesi dengan kunci sama (sekolah+kelas+jam) ditimpa. replace_day=true mengosongkan
        hari itu dulu.'
      operationId: POST__api_schedule_generate_api_schedule_generate_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScheduleRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - HTTPBearer: []
  /api/schedule/generate-multi:
    post:
      summary: Post /Api/Schedule/Generate-Multi
      description: Generate beberapa hari sekaligus, dengan opsi max_daily_minutes
        / max_weekly_minutes.
      operationId: POST__api_schedule_generate_multi_api_schedule_generate_multi_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MultiDayRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - HTTPBearer: []
  /api/schedule/manual:
    post:
      summary: Post /Api/Schedule/Manual
      description: Simpan pilihan admin untuk satu sesi (guru dipilih dari GET /api/teachers/available).
      operationId: POST__api_schedule_manual_api_schedule_manual_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ManualScheduleRequest'
        required: true
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - HTTPBearer: []
  /api/schedule/{day}:
    get:
      summary: Get /Api/Schedule/{Day}
      operationId: GET__api_schedule__day__api_schedule__day__get
      security:
      - HTTPBearer: []
      parameters:
      - name: day
        in: path
        required: true
        schema:
          type: string
          title: Day
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    delete:
      summary: Delete /Api/Schedule/{Day}
      description: Hapus seluruh jadwal hari itu (atau hanya satu sekolah bila `school`
        diisi).
      operationId: DELETE__api_schedule__day__api_schedule__day__delete
      security:
      - HTTPBearer: []
      parameters:
      - name: day
        in: path
        required: true
        schema:
          type: string
          title: Day
      - name: school
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: School
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/schools:
